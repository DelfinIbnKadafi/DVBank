<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVBank - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h2>Silakan Mendaftar</h2>

    <form id="registerForm">

      <div class="input-group">
        <label for="fullname">Nama Lengkap</label>
        <input type="text" id="fullname" name="fullname" required>
      </div>
      <div class="input-group">
        <label for="username">Nama Pengguna</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="input-group">
        <label for="phone">Nomor Telepon</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div class="input-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="input-group">
        <label for="confirmPassword">Konfirmasi Kata Sandi</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
      </div>
      <button type="submit">Daftar</button>
      <div class="register/login" style="display: flex; align-items: center; gap: 8px;">
        <h5>Sudah punya akun?</h5>
        <a href="Login.html" style="color: blue; text-decoration: underline;">Masuk Disini</a>
      </div>
    </form>
  </div>
  <script src="scripts/register.js"></script>
</body>
</html>
